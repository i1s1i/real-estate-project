services:
  - type: web
    name: real-estate-riyadh
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    plan: free
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///instance/app.db
      - key: PYTHON_VERSION
        value: 3.11.0
      # Render يُعبئ هذا المتغير تلقائياً برابط تطبيقك العام
      # مثال: https://real-estate-riyadh.onrender.com
      # يُستخدم في config.py ويُعرض في /api/ping لإبقاء السيرفر مستيقظاً
      - key: RENDER_EXTERNAL_URL
        fromService:
          type: web
          name: real-estate-riyadh
          property: host
